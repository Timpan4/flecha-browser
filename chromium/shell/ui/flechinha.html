<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; font-src 'self'; img-src * data: favicon:; style-src 'self'; script-src 'self'"
    />
    <title>Flechinha</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="windowControls.css" />
    <link rel="stylesheet" href="flechinha.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="traffic-lights"></div>
      <div class="window-controls" role="group" aria-label="Window">
        <button id="wc-close" class="window-control close" type="button" aria-label="Close window"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.75 3.75l4.5 4.5M8.25 3.75l-4.5 4.5" /></svg></button>
        <button id="wc-minimize" class="window-control minimize" type="button" aria-label="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.25 6h5.5" /></svg></button>
        <button id="wc-maximize" class="window-control maximize" type="button" aria-label="Maximize"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="grow" d="M3.5 6.5v-3h3M8.5 5.5v3h-3" /><path class="shrink" d="M6 3v3H3M6 9V6h3" /></svg></button>
      </div>
      <button id="back" class="icon-button" title="Back  ⌘[" disabled><i data-icon="arrowLeft"></i></button>
      <button id="forward" class="icon-button" title="Forward  ⌘]" disabled><i data-icon="arrowRight"></i></button>
      <button id="reload" class="icon-button" title="Reload  ⌘R"><i data-icon="reload"></i></button>

      <div id="address">
        <button id="address-show" type="button" title="Edit address  ⌘L">
          <span id="site-icon"></span>
          <span id="host"></span>
          <span id="page-title"></span>
        </button>
        <form id="address-edit" hidden>
          <i data-icon="search"></i>
          <input id="address-input" spellcheck="false" autocomplete="off" placeholder="Search or enter address" />
        </form>
        <button id="copy" class="address-action" type="button" title="Copy link  ⇧⌘C"><i data-icon="link"></i></button>
      </div>

      <button id="open-in-flecha" type="button">
        <i data-icon="external"></i>
        <span>Open in Flecha</span>
      </button>
    </header>

    <main id="empty" hidden>
      <div class="empty-card">
        <div class="empty-mark"><i data-icon="search"></i></div>
        <h1>Look something up</h1>
        <p id="empty-hint">Type an address, or anything to search.</p>
        <p class="keys"><kbd>esc</kbd> closes&ensp;·&ensp;<kbd>⌘O</kbd> keeps it in Flecha</p>
      </div>
    </main>

    <script type="module" src="flechinha.js"></script>
  </body>
</html>
