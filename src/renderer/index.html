<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; font-src 'self'; img-src * data: crx: favicon:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Flecha</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="toolbar">
        <div class="traffic-lights"></div>
        <button id="btn-sidebar" class="icon-button" title="Hide sidebar (⌘S)"><i data-icon="sidebar"></i></button>
        <span class="spacer"></span>
        <button id="btn-back" class="icon-button" title="Back (⌘[)"><i data-icon="arrowLeft"></i></button>
        <button id="btn-forward" class="icon-button" title="Forward (⌘])"><i data-icon="arrowRight"></i></button>
        <button id="btn-reload" class="icon-button" title="Reload (⌘R)"><i data-icon="reload"></i></button>
      </div>

      <button id="urlbar" title="Open location (⌘L)">
        <span id="urlbar-icon"></span>
        <span id="urlbar-env"></span>
        <span id="urlbar-text"></span>
      </button>

      <browser-action-list id="extensions"></browser-action-list>

      <div id="agent-status" hidden>
        <span class="agent-dot"></span>
        <span id="agent-status-text"></span>
      </div>

      <div id="favorites"></div>

      <section id="local-servers" class="group" hidden>
        <header class="group-header"><span>Running locally</span></header>
        <div id="local-server-list"></div>
      </section>

      <header id="space-header">
        <span id="space-emoji"></span>
        <span id="space-title"></span>
        <span id="space-isolated" title="This Space has its own cookies and logins" hidden><i data-icon="lock"></i></span>
      </header>

      <div id="scroll">
        <div id="pinned" class="drop-zone"></div>
        <header class="group-header today-header">
          <span>Today</span>
          <button id="btn-clear" class="text-button" title="Archive today's tabs (⇧⌘K)">Clear</button>
        </header>
        <button id="btn-newtab" class="row new-tab"><span class="row-icon"><i data-icon="plus"></i></span><span class="title">New Tab</span><kbd>⌘T</kbd></button>
        <div id="today" class="drop-zone"></div>
      </div>

      <div id="downloads-panel" class="popover" hidden>
        <header class="popover-header">
          <span>Downloads</span>
          <button id="btn-clear-downloads" class="text-button">Clear</button>
        </header>
        <ul id="downloads-list"></ul>
      </div>

      <footer>
        <button id="btn-downloads" class="icon-button" title="Downloads">
          <i data-icon="download"></i>
          <span id="downloads-badge" hidden></span>
        </button>
        <div id="spaces"></div>
        <button id="btn-newspace" class="icon-button" title="New Space (⌃⇧N)"><i data-icon="plus"></i></button>
      </footer>
    </aside>

    <div id="peek" hidden>
      <div class="peek-bar">
        <span class="peek-title"></span>
        <button id="peek-open" class="pill-button" title="Open as a tab"><i data-icon="external"></i>Open as Tab</button>
        <button id="peek-close" class="icon-button" title="Close (Esc)"><i data-icon="close"></i></button>
      </div>
    </div>

    <div id="palette" hidden>
      <div class="palette-box">
        <div class="palette-field">
          <i data-icon="search"></i>
          <input id="palette-input" spellcheck="false" autocomplete="off" placeholder="Search tabs, history, or type a URL" />
          <span id="palette-mode"></span>
        </div>
        <ul id="palette-results"></ul>
        <pre id="palette-detail" hidden></pre>
        <footer class="palette-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span><kbd>↵</kbd> Open</span>
          <span><kbd>esc</kbd> Close</span>
        </footer>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
