<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Flecha</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="toolbar">
        <div class="traffic-lights"></div>
        <button id="btn-sidebar" class="icon" title="Hide sidebar (⌘S)">
          <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" /><path d="M6 2.5v11" /></svg>
        </button>
        <span class="spacer"></span>
        <button id="btn-back" class="icon" title="Back (⌘[)">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button id="btn-forward" class="icon" title="Forward (⌘])">
          <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg>
        </button>
        <button id="btn-reload" class="icon" title="Reload (⌘R)">
          <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3" /></svg>
        </button>
      </div>

      <button id="urlbar" title="Open location (⌘L)"></button>

      <browser-action-list id="extensions"></browser-action-list>

      <div id="agent-status" hidden>
        <span class="agent-dot"></span>
        <span id="agent-status-text"></span>
      </div>

      <div id="favorites"></div>

      <div id="local-servers" hidden>
        <div class="section-label">Running locally</div>
        <div id="local-server-list"></div>
      </div>

      <div id="space-header">
        <span id="space-title"></span>
        <span id="space-isolated" title="This Space has its own cookies and logins" hidden>
          <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" /><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" /></svg>
        </span>
      </div>

      <div id="scroll">
        <div id="pinned" class="drop-zone"></div>
        <div class="today-divider">
          <span></span>
          <button id="btn-clear" title="Archive today's tabs (⇧⌘K)">Clear</button>
        </div>
        <button id="btn-newtab" class="row new-tab"><span class="plus">+</span> New Tab</button>
        <div id="today" class="drop-zone"></div>
      </div>

      <div id="downloads-panel" hidden>
        <div class="downloads-header">
          <span>Downloads</span>
          <button id="btn-clear-downloads">Clear</button>
        </div>
        <ul id="downloads-list"></ul>
      </div>

      <footer>
        <button id="btn-downloads" class="icon" title="Downloads">
          <svg viewBox="0 0 16 16"><path d="M8 2v8m-3-3 3 3 3-3M3 13h10" /></svg>
          <span id="downloads-badge" hidden></span>
        </button>
        <button id="btn-import" class="icon" title="Import from Arc">
          <svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2 6h9M11 7l3 3-3 3M14 10H5" /></svg>
        </button>
        <div id="spaces"></div>
        <button id="btn-newspace" class="icon" title="New space">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
        </button>
      </footer>
    </aside>

    <div id="peek" hidden>
      <div class="peek-bar">
        <span class="peek-title"></span>
        <button id="peek-open" title="Open as a tab">
          <svg viewBox="0 0 16 16"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9" /></svg>
          Open
        </button>
        <button id="peek-close" class="icon" title="Close (Esc)">
          <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </div>
    </div>

    <div id="palette" hidden>
      <div class="palette-box">
        <input id="palette-input" spellcheck="false" autocomplete="off" placeholder="Search or enter URL…" />
        <ul id="palette-results"></ul>
        <pre id="palette-detail" hidden></pre>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
