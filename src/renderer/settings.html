<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header class="titlebar">Settings</header>
    <main>
      <section>
        <h2>General</h2>
        <div class="row">
          <span>
            <strong>Default browser</strong>
            <small id="defaultBrowserStatus"></small>
          </span>
          <button id="makeDefault">Make Default</button>
        </div>
        <label class="row">
          <span>
            <strong>Search engine</strong>
            <small>Used when what you type in the command bar isn't a web address.</small>
          </span>
          <select id="searchEngine"></select>
        </label>
      </section>

      <section id="environments">
        <h2>Environments</h2>
        <div class="row column">
          <small>
            Group the places a project runs. <strong>⌥⌘E</strong> moves the current page to the next one, keeping the path,
            and the address bar shows which one you're on. One per line: <code>label origin</code>.
          </small>
          <div id="environmentList"></div>
          <button id="addEnvironment">Add Project</button>
        </div>
      </section>

      <section>
        <h2>Downloads</h2>
        <div class="row">
          <span>
            <strong>Save files to</strong>
            <small id="downloadsFolder"></small>
          </span>
          <button id="chooseFolder">Change…</button>
        </div>
        <label class="row">
          <span>
            <strong>Ask where to save each file</strong>
          </span>
          <input type="checkbox" id="askWhereToSave" class="switch" />
        </label>
      </section>

      <section>
        <h2>Privacy</h2>
        <label class="row">
          <span>
            <strong>Block ads and trackers</strong>
            <small>Uses the EasyList, EasyPrivacy and uBlock filter lists.</small>
          </span>
          <input type="checkbox" id="adBlock" class="switch" />
        </label>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
