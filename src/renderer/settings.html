<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header class="titlebar">Settings</header>
    <main>
      <section>
        <h2>General</h2>
        <label class="row">
          <span>
            <strong>Search engine</strong>
            <small>Used when what you type in the command bar isn't a web address.</small>
          </span>
          <select id="searchEngine"></select>
        </label>
      </section>

      <section>
        <h2>Privacy</h2>
        <label class="row">
          <span>
            <strong>Block ads and trackers</strong>
            <small>Uses the EasyList, EasyPrivacy and uBlock filter lists.</small>
          </span>
          <input type="checkbox" id="adBlock" class="switch" />
        </label>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
