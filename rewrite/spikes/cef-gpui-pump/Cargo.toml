[package]
name = "cef-gpui-pump"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# cef, gpui and gpui_platform come from the workspace: the cef-rs and Zed
# sources that spikes/gpui-cef-compositor/prepare.sh stages at the pins.toml
# revs. cef-dll-sys declares `links = "cef_dll_wrapper"`, so the workspace can
# hold only one cef-rs source. The workspace cef has no `accelerated_osr`: this
# spike uploads software OnPaint frames.
#
# The app is Linux only (`/proc`, pidfds, X11); other targets build a stub
# binary and the CEF-free library, which needs only serde_json.
[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
cef.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

anyhow.workspace = true
base64 = "0.22"
env_logger = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false }
libc = "0.2"

# The binary links libcef.so, which only the runner's bundle provides, so its
# test target could not start. Tests live in the CEF-free library.
[[bin]]
name = "cef-gpui-pump"
path = "src/main.rs"
test = false

[lints.cargo]
# `cargo test` builds only the library, so Cargo reports the binary's CEF and
# GPUI dependencies as unused there. A full build uses all of them.
unused_dependencies = "allow"
