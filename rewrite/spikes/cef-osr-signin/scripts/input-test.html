<!doctype html>
<meta charset="utf-8">
<title>Flecha spike input test</title>
<style>
  body { margin: 0; font: 16px sans-serif; height: 3000px; }
  #text { position: absolute; left: 20px; top: 20px; width: 300px; height: 30px; }
  #password { position: absolute; left: 20px; top: 70px; width: 300px; height: 30px; }
  #area { position: absolute; left: 20px; top: 120px; width: 300px; height: 80px; }
  #choice { position: absolute; left: 20px; top: 220px; width: 300px; height: 30px; }
  #button { position: absolute; left: 20px; top: 270px; width: 300px; height: 30px; }
  #popup { position: absolute; left: 20px; top: 320px; width: 300px; height: 30px; }
  #notify { position: absolute; left: 20px; top: 370px; width: 300px; height: 30px; }
  #camera { position: absolute; left: 20px; top: 420px; width: 300px; height: 30px; }
  #close { position: absolute; left: 20px; top: 20px; width: 300px; height: 30px; }
</style>
<input id="text" autocomplete="off">
<input id="password" type="password" autocomplete="off">
<textarea id="area"></textarea>
<select id="choice"><option>one</option><option>two</option><option>three</option></select>
<button id="button">button</button>
<button id="popup">window.open</button>
<button id="notify">Notification.requestPermission</button>
<button id="camera">getUserMedia video</button>
<script>
  const log = (...parts) => console.log('INPUT ' + parts.join(' '));
  if (location.search === '?child') {
    // Opened by the #popup button: report the opener, then close itself from a button.
    document.body.innerHTML = '<button id="close">window.close</button>';
    log('child opener', window.opener !== null);
    document.getElementById('close').addEventListener('click', () => window.close());
  } else {
    // Counts loads in this profile; a restart on the same --profile must print one more.
    const loads = Number(localStorage.getItem('flecha-loads') || 0) + 1;
    localStorage.setItem('flecha-loads', String(loads));
    log('storage loads', loads);
    // Never type a real secret here. Even so, the password field reports only its length and
    // whether it equals the scripted test string, and its key presses are not logged.
    const SCRIPTED_PASSWORD = 'pa$$ wörd';
    for (const id of ['text', 'area']) {
      document.getElementById(id).addEventListener('input', e => log(id, JSON.stringify(e.target.value)));
    }
    // The action scripts wait for focus before typing, so keys never go to the document.
    for (const id of ['text', 'password', 'area', 'camera']) {
      document.getElementById(id).addEventListener('focus', () => log('focus', id));
    }
    document.getElementById('password').addEventListener('input', e => {
      const v = e.target.value;
      log('password length', [...v].length, 'scripted', v === SCRIPTED_PASSWORD);
    });
    document.getElementById('choice').addEventListener('change', e => log('choice', e.target.value));
    document.getElementById('button').addEventListener('click', e => log('click', e.detail));
    document.getElementById('button').addEventListener('dblclick', () => log('dblclick'));
    document.getElementById('popup').addEventListener('click', () => {
      const child = window.open(location.pathname + '?child', 'child');
      log('popup opened', child !== null);
    });
    document.getElementById('notify').addEventListener('click', () => {
      Notification.requestPermission().then(r => log('notification', r));
    });
    document.getElementById('camera').addEventListener('click', () => {
      log('camera requested');
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => { log('camera granted', s.getVideoTracks().length); s.getTracks().forEach(t => t.stop()); })
        .catch(e => log('camera error', e.name));
    });
    document.addEventListener('keydown', e => {
      if (e.target.type !== 'password') log('keydown', e.key, e.code, e.keyCode, 'ctrl', e.ctrlKey);
    });
    addEventListener('scroll', () => log('scroll', Math.round(scrollY)));
    // A browser prompt that takes keyboard focus (Chrome's permission bubble) blurs the page.
    addEventListener('blur', () => log('window blur'));
  }
</script>
