[package]
name = "cef-osr-signin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pins from rewrite/pins.toml. The rev is on branch flecha/cef-158.0.3 of the Flecha fork.
# The CEF runtime comes from prepare.sh (pinned archive and SHA-1) through CEF_PATH; build with
# build.sh, which checks it first.
cef = { git = "https://github.com/Timpan4/cef-rs", rev = "32d6bc558545933eb1b4620aac4bc4799299c129", default-features = false, features = ["sandbox"] }
# winit 0.30 is the newest stable line (0.31 is in beta). softbuffer 0.4 uses the same
# raw-window-handle 0.6.
winit = "0.30.13"
softbuffer = "0.4.8"
serde_json = "1.0.154"
