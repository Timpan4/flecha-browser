[package]
name = "cef-osr-signin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The workspace's cef-rs: the pinned rev from rewrite/pins.toml, staged and patched by
# spikes/gpui-cef-compositor/prepare.sh. One workspace can hold only one cef-dll-sys (it sets
# `links`). Its build script links against Spike 1's staged copy of the pinned beta archive; at
# run time run.sh loads the copy this spike's prepare.sh staged. Build with build.sh.
cef = { workspace = true, features = ["sandbox"] }
# winit 0.30 is the newest stable line (0.31 is in beta). softbuffer 0.4 uses the same
# raw-window-handle 0.6.
winit = "0.30.13"
softbuffer = "0.4.8"
serde_json = "1.0.154"
