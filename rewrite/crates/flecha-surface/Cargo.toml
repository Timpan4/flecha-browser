[package]
name = "flecha-surface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
cef = { workspace = true, features = ["accelerated_osr"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = "0.2"
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["dri3"] }
