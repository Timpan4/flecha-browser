[package]
name = "flecha-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
flecha-core = { path = "../flecha-core" }
indexmap = { version = "2.14.2", features = ["serde"] }
plist = { version = "1.10.4", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
regex = "1"
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
