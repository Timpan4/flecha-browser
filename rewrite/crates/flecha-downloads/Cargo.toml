[package]
name = "flecha-downloads"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
flecha-core = { path = "../flecha-core" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
