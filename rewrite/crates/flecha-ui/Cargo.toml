[package]
name = "flecha-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-compat = "0.2.6"
async-io = "2.6.0"
cef.workspace = true
chrono = "0.4"
flecha-adblock.workspace = true
flecha-boosts.workspace = true
flecha-cef.workspace = true
flecha-core.workspace = true
flecha-downloads.workspace = true
flecha-history.workspace = true
flecha-import.workspace = true
flecha-permissions.workspace = true
flecha-services.workspace = true
flecha-surface.workspace = true
futures.workspace = true
gpui.workspace = true
open = "5"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["time"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flecha-services = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt"] }
