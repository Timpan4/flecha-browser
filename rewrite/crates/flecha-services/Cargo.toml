[package]
name = "flecha-services"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.105"
base64 = "0.23"
bytes = "1"
flecha-core = { path = "../flecha-core" }
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-core = "0.1"

[dev-dependencies]
rmcp = { version = "3.11.0", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
