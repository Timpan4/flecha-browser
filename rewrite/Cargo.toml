[workspace]
resolver = "3"
members = [
    "app",
    "crates/flecha-adblock",
    "crates/flecha-cef",
    "crates/flecha-core",
    "crates/flecha-downloads",
    "crates/flecha-import",
    "crates/flecha-services",
    "crates/flecha-surface",
    "crates/flecha-ui",
    "spikes/cef-gpui-pump",
    "spikes/cef-osr-signin",
    "spikes/gpui-cef-compositor",
]
exclude = ["target/spike1-src/zed", "target/spike1-src/cef-rs"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
cef = { path = "target/spike1-src/cef-rs/cef", default-features = false }
flecha-cef = { path = "crates/flecha-cef" }
flecha-core = { path = "crates/flecha-core" }
flecha-services = { path = "crates/flecha-services" }
flecha-surface = { path = "crates/flecha-surface" }
flecha-ui = { path = "crates/flecha-ui" }
futures = "0.3"
gpui = { path = "target/spike1-src/zed/crates/gpui", default-features = false }
gpui_platform = { path = "target/spike1-src/zed/crates/gpui_platform", features = ["font-kit", "x11", "wayland"] }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false }

[patch.crates-io]
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
