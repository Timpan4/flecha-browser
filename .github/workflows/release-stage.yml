name: Release build stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      previous:
        type: number
        required: true
      last:
        type: boolean
        default: false
      platforms:
        type: string
        required: true
    outputs:
      incomplete:
        description: The stage needs another Chromium build job.
        value: ${{ jobs.build.outputs.incomplete }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ matrix.platform }} stage ${{ inputs.stage }}
    outputs:
      incomplete: ${{ steps.checkpoint.outputs.complete == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record stage start
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'FLECHA_STAGE_STARTED=' + Date.now() + '\n')"
      - name: Select Xcode before removing unused SDKs
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Reclaim unused hosted tooling
        run: node chromium/scripts/ci-cleanup.mjs
      - name: Verify selected macOS toolchain survived cleanup
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Chromium Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./chromium/scripts/ci-windows-sdk.ps1
      - uses: actions/download-artifact@v8
        with:
          name: shell-and-host
          path: shell-and-host
      - name: Restore built shell and host
        shell: bash
        run: tar -xzf shell-and-host/shell-and-host.tar.gz
      - name: Restore previous checkpoint
        if: inputs.stage != 0
        uses: actions/download-artifact@v8
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
          path: checkpoint
      - name: Unpack previous checkpoint
        if: inputs.stage != 0
        run: node chromium/scripts/ci-release.mjs restore
      - name: Install packaging dependencies
        if: runner.os == 'macOS'
        run: npm ci
      - name: Prepare Chromium source and toolchains
        id: prepare
        if: inputs.stage == 0
        env:
          GH_TOKEN: ${{ github.token }}
          FLECHA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Owner-selected total budget for optional reuse before a clean preparation.
          FLECHA_REUSE_BUDGET_MINUTES: '60'
        run: node chromium/scripts/ci-release.mjs prepare
      - name: Compile and package
        id: compile
        if: inputs.stage != 0
        shell: bash
        run: |
          export CHROMIUM_SRC="$RUNNER_WORKSPACE/flecha-chromium/src"
          export FLECHA_DISK="$RUNNER_WORKSPACE/flecha-chromium"
          node chromium/scripts/ci-release.mjs build
      - name: Upload completed platform package
        if: steps.prepare.outputs.package != '' || steps.compile.outputs.package != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.package || steps.compile.outputs.package }}
          path: release/*
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 35
      - name: Hand the package to the publisher
        id: publisher
        if: steps.prepare.outputs.package != '' || steps.compile.outputs.package != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_ARTIFACT: ${{ steps.prepare.outputs.package || steps.compile.outputs.package }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          run_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish-nightly-platform.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[build_run]=$GITHUB_RUN_ID" -f "inputs[platform]=$RELEASE_PLATFORM" \
            -f "inputs[artifact]=$PACKAGE_ARTIFACT" --jq '.workflow_run_id')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo '::error::The publisher did not return a workflow run ID.'
            exit 1
          fi
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Save checkpoint
        id: checkpoint
        if: steps.prepare.outputs.package == '' && steps.compile.outputs.package == ''
        run: node chromium/scripts/ci-release.mjs checkpoint
      - uses: actions/upload-artifact@v7
        if: steps.checkpoint.outputs.complete == 'false'
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.stage }}
          path: checkpoint.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Index resumable native checkpoint after successful upload
        if: steps.checkpoint.outputs.reuse-key != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reuse-${{ matrix.platform }}-${{ steps.checkpoint.outputs.reuse-key }}-${{ inputs.stage }}
          path: reuse.json
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Delete superseded checkpoint after successful handoff
        if: inputs.stage != 0 && !inputs.last && steps.checkpoint.outputs.complete == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NAME: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$PREVIOUS_NAME\") | .id")
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
      - name: Create optional native snapshot after required release uploads
        id: native
        if: ${{ !cancelled() && inputs.stage != 0 && (runner.os == 'macOS' || failure()) }}
        continue-on-error: true
        run: node chromium/scripts/ci-release.mjs native-checkpoint
      - name: Preserve native outputs for later nightlies and packaging recovery
        if: ${{ !cancelled() && steps.native.outputs.native-key != '' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.native.outputs.upload-minutes) }}
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ steps.native.outputs.native-key }}
          path: native.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Report an unfinished final stage
        if: inputs.last && steps.checkpoint.outputs.complete == 'false'
        run: exit 1
      - name: Confirm publication succeeded
        if: ${{ !cancelled() && steps.publisher.outputs.run-id != '' }}
        # Queueing and publication share the existing one-hour upload allowance.
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ steps.publisher.outputs.run-id }}
        shell: bash
        run: gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --compact --exit-status
