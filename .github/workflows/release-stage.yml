name: Release build stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      previous:
        type: number
        required: true
      platforms:
        type: string
        required: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ matrix.platform }} stage ${{ inputs.stage }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record stage start
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'FLECHA_STAGE_STARTED=' + Date.now() + '\n')"
      - name: Reclaim unused hosted tooling
        run: node chromium/scripts/ci-cleanup.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Chromium Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./chromium/scripts/ci-windows-sdk.ps1
      - uses: actions/download-artifact@v8
        with:
          name: shell-and-host
          path: shell-and-host
      - name: Restore built shell and host
        shell: bash
        run: tar -xzf shell-and-host/shell-and-host.tar.gz
      - name: Restore previous checkpoint
        if: inputs.stage != 0
        uses: actions/download-artifact@v8
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
          path: checkpoint
      - name: Unpack previous checkpoint
        if: inputs.stage != 0
        run: node chromium/scripts/ci-release.mjs restore
      - name: Install packaging dependencies
        if: runner.os == 'macOS'
        run: npm ci
      - name: Prepare Chromium source and toolchains
        if: inputs.stage == 0
        env:
          GH_TOKEN: ${{ github.token }}
          FLECHA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node chromium/scripts/ci-release.mjs prepare
      - name: Compile and package
        id: build
        if: inputs.stage != 0
        shell: bash
        run: |
          export CHROMIUM_SRC="$RUNNER_WORKSPACE/flecha-chromium/src"
          export FLECHA_DISK="$RUNNER_WORKSPACE/flecha-chromium"
          node chromium/scripts/ci-release.mjs build
      - name: Preserve native outputs for later nightlies and packaging recovery
        if: always() && steps.build.outputs.native-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ steps.build.outputs.native-key }}
          path: native.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Upload completed platform package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          overwrite: true
          if-no-files-found: ignore
          compression-level: 0
          # A finished platform must remain available while the other platforms build.
          # 35 days is GitHub's maximum lifetime for the entire workflow.
          retention-days: 35
      - name: Save checkpoint
        id: checkpoint
        run: node chromium/scripts/ci-release.mjs checkpoint
      - uses: actions/upload-artifact@v7
        with:
          name: checkpoint-${{ matrix.platform }}-${{ inputs.stage }}
          path: checkpoint.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Index resumable native checkpoint after successful upload
        if: steps.checkpoint.outputs.reuse-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: reuse-${{ matrix.platform }}-${{ steps.checkpoint.outputs.reuse-key }}-${{ inputs.stage }}
          path: reuse.json
          if-no-files-found: error
          overwrite: true
          retention-days: 35
      - name: Delete superseded checkpoint after successful handoff
        if: inputs.stage != 0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NAME: checkpoint-${{ matrix.platform }}-${{ inputs.previous }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$PREVIOUS_NAME\") | .id")
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi
