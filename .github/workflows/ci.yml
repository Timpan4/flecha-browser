# What can be checked without a Chromium build: the shell and the native host compile, bundle
# and pass their tests, the scripts pass shellcheck, and the patches apply to the pinned
# Chromium. The separate Nightly release workflow builds Chromium itself.
#
# Branch protection requires "CI passed" alone, so jobs can be added or renamed here
# without changing the repository settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its running checks; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-and-host:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          # Node 26 aborts on the deep-state recovery test. Keep validation on 24.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Compute the adblock cache bucket
        id: adblock-cache
        run: node --input-type=module -e "import { adblockCacheBucket } from './chromium/shell/build-adblock.mjs'; console.log('bucket=' + adblockCacheBucket())" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: chromium/shell/.cache/adblock
          key: adblock-ci-${{ runner.os }}-${{ steps.adblock-cache.outputs.bucket }}
          restore-keys: adblock-ci-${{ runner.os }}-
      - run: npm run check:build
      # Patches are left out: their context lines keep Chromium's own trailing spaces.
      - name: No whitespace errors in the change
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD -- . ':!*.patch'

  rewrite-core:
    name: Flecha core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check the rewrite workspace lock
        shell: bash
        run: |
          bash spikes/gpui-cef-compositor/prepare.sh --sources-only
          time cargo +stable metadata --locked --format-version 1 > /dev/null
      - name: Check the core crate in isolation
        shell: bash
        run: |
          core_rewrite="$RUNNER_TEMP/flecha-core-ci/rewrite"
          mkdir -p "$core_rewrite"
          cp -R crates/flecha-core/. "$core_rewrite/"
          cp Cargo.lock "$core_rewrite/"
          cd "$core_rewrite"
          # Resolving the product workspace would fetch Spike 1's Git dependencies.
          cargo +stable metadata --format-version 1 > metadata.json
          jq -e '[.packages[].source | select(. != null and startswith("git+"))] | length == 0' metadata.json
          cargo +stable fmt --check
          cargo +stable clippy -p flecha-core --all-targets -- -D warnings
          cargo +stable test -p flecha-core --all-targets

  release-scripts:
    name: Release tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Select release Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify selected Xcode and macOS SDK
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify patches on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: chromium/scripts/check-patches.sh
      - run: npm ci
      - run: node --test chromium/tests/ci-release.test.mjs chromium/tests/ci-setup.test.mjs chromium/tests/ci-stage-zero.test.mjs chromium/tests/build-adblock.test.mjs
      - name: Compute the adblock cache bucket
        id: adblock-cache
        shell: bash
        run: node --input-type=module -e "import { adblockCacheBucket } from './chromium/shell/build-adblock.mjs'; console.log('bucket=' + adblockCacheBucket())" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: runner.os == 'Linux'
        with:
          path: chromium/shell/.cache/adblock
          key: adblock-ci-${{ runner.os }}-${{ steps.adblock-cache.outputs.bucket }}
          restore-keys: adblock-ci-${{ runner.os }}-
      - uses: actions/cache@v6
        if: runner.os != 'Linux'
        with:
          path: chromium/shell/.cache/adblock
          key: adblock-ci-${{ runner.os }}-${{ steps.adblock-cache.outputs.bucket }}
          restore-keys: adblock-ci-${{ runner.os }}-
      - run: npm run check:build

  scripts:
    name: Workflows, shell scripts and Chromium patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest comes with shellcheck; .shellcheckrc lets it follow `. env.sh`.
      - name: Shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -S warning
      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Patches apply to Chromium
        run: chromium/scripts/check-patches.sh

  ci-passed:
    name: CI passed
    if: always()
    needs: [shell-and-host, rewrite-core, release-scripts, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        if: always()
        env:
          ALL_PASSED: ${{ needs.shell-and-host.result == 'success' && needs.rewrite-core.result == 'success' && needs.release-scripts.result == 'success' && needs.scripts.result == 'success' }}
        run: test "$ALL_PASSED" = true
