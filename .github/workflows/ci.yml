# What can be checked without a Chromium build: the shell and the native host compile, bundle
# and pass their tests, the scripts pass shellcheck, and the patches apply to the pinned
# Chromium. Building Chromium itself stays on the build machines (chromium/scripts).
#
# Branch protection requires "CI passed" alone, so jobs can be added or renamed here
# without changing the repository settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its running checks; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-and-host:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tsrs
      - run: npm test
      - run: npm run shell:build
      - run: npm run host:build
      # Patches are left out: their context lines keep Chromium's own trailing spaces.
      - name: No whitespace errors in the change
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD -- . ':!*.patch'

  scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest comes with shellcheck; .shellcheckrc lets it follow `. env.sh`.
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -S warning

  patches:
    name: Patches apply to Chromium
    runs-on: ubuntu-latest
    env:
      FLECHA_CHROMIUM_FILES: ${{ github.workspace }}/.chromium-files
    steps:
      - uses: actions/checkout@v7
      # Files at a Chromium tag never change. Keeping them spares googlesource, which answers
      # a burst of fetches with HTTP 429, and turns a minute of downloads into a restore.
      - uses: actions/cache@v6
        with:
          path: ${{ env.FLECHA_CHROMIUM_FILES }}
          key: chromium-files-${{ hashFiles('chromium/CHROMIUM_VERSION') }}-${{ hashFiles('chromium/patches/*.patch') }}
          restore-keys: chromium-files-${{ hashFiles('chromium/CHROMIUM_VERSION') }}-
      - run: chromium/scripts/check-patches.sh

  ci-passed:
    name: CI passed
    if: always()
    needs: [shell-and-host, scripts, patches]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
