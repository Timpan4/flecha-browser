name: Nightly release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One release across all branches and both triggers. Active builds finish.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run shell:build
      - run: npm run host:build
      - id: platforms
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + JSON.stringify(require('./chromium/build/ci-platforms.json')) + '\\n')"
      - run: tar -czf shell-and-host.tar.gz chromium/shell/dist chromium/native-host/dist
      - uses: actions/upload-artifact@v7
        with:
          name: shell-and-host
          path: shell-and-host.tar.gz
          retention-days: 1

  source:
    needs: prepare
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 0
      previous: 0
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-1:
    needs: [prepare, source]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 1
      previous: 0
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-2:
    needs: [prepare, build-1]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 2
      previous: 1
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-3:
    needs: [prepare, build-2]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 3
      previous: 2
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-4:
    needs: [prepare, build-3]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 4
      previous: 3
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-5:
    needs: [prepare, build-4]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 5
      previous: 4
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-6:
    needs: [prepare, build-5]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 6
      previous: 5
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-7:
    needs: [prepare, build-6]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 7
      previous: 6
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-8:
    needs: [prepare, build-7]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 8
      previous: 7
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-9:
    needs: [prepare, build-8]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 9
      previous: 8
      platforms: ${{ needs.prepare.outputs.platforms }}

  build-10:
    needs: [prepare, build-9]
    uses: ./.github/workflows/release-stage.yml
    permissions:
      contents: read
      actions: write
    with:
      stage: 10
      previous: 9
      platforms: ${{ needs.prepare.outputs.platforms }}

  publish:
    needs: build-10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all platforms and publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node chromium/scripts/ci-publish.mjs

