name: Nightly release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One release across all branches and both triggers. Active builds finish.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run shell:build
      - run: npm run host:build
      - id: platforms
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + JSON.stringify(require('./chromium/build/ci-platforms.json')) + '\\n')"
      - run: tar -czf shell-and-host.tar.gz chromium/shell/dist chromium/native-host/dist
      - uses: actions/upload-artifact@v7
        with:
          name: shell-and-host
          path: shell-and-host.tar.gz
          overwrite: true
          # Keep inputs for GitHub's maximum workflow lifetime, including queue time.
          retention-days: 35

  # Each platform builds and publishes on its own, so a slow or failed
  # platform does not hold back the others.
  release:
    name: ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      actions: write
    with:
      platforms: ${{ format('[{0}]', toJSON(matrix)) }}
